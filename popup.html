<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OtterCopy</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div class="header-main">
          <h1>OtterCopy</h1>
          <div class="model-pickers">
            <label class="model-picker-field">
              <span>Active</span>
              <select id="activeModelPicker" title="Active model"></select>
            </label>
            <label class="model-picker-field">
              <span>Final pass</span>
              <select id="finalPassModelPicker" title="Final pass model"></select>
            </label>
          </div>
          <p id="activePromptSummary">No prompt selected</p>
        </div>
        <button id="modelSettingsButton" class="icon-button" type="button" title="Model settings">
          Settings
        </button>
      </header>

      <label class="direction-field">
        <span>Direction (optional)</span>
        <textarea id="directionInput" rows="3" spellcheck="true"
          placeholder="Nudge the agents: which topic to focus on, what to prioritize, what to ignore."></textarea>
      </label>
      <label class="checkbox-field direction-override-field">
        <input id="directionPromptOverride" type="checkbox">
        <span>Use direction as the only prompt</span>
      </label>

      <label class="manual-transcript-field">
        <span>Manual transcript (optional)</span>
        <textarea id="manualTranscriptInput" rows="3" spellcheck="false"
          placeholder="Paste a transcript here. Appended to the Otter.ai transcript by default; check below to use it as the only source."></textarea>
      </label>
      <label class="checkbox-field manual-transcript-override-field">
        <input id="manualTranscriptOverride" type="checkbox">
        <span>Use pasted transcript as the only source (skip Otter.ai)</span>
      </label>

      <div class="refine-controls">
        <label class="refine-type-field">
          <span>Type</span>
          <select id="refineType"></select>
        </label>
        <label class="checkbox-field extended-toggle-field">
          <input id="extendedToggle" type="checkbox">
          <span>Extended review</span>
        </label>
      </div>

      <button id="refineButton" class="primary-action ai-action" type="button">
        Refine and copy
      </button>
      <button class="copy-action exact-action" type="button" data-mode="exact">
        Copy exact transcript
      </button>

      <div class="secondary-actions">
        <button id="copyLatestResultButton" class="compact-action saved-result-action" type="button"
          title="Copy latest result">
          ⧉ Latest result
        </button>
        <button id="stopRefinementButton" class="compact-action stop-action" type="button"
          title="Stop refinement">
          ◼ Stop
        </button>
      </div>
      <p id="latestResultSummary" class="result-summary">No saved result</p>
      <p id="status" role="status" aria-live="polite"></p>

      <section id="modelSettingsPanel" class="settings-panel hidden" aria-labelledby="modelSettingsTitle">
        <div class="settings-header">
          <h2 id="modelSettingsTitle">Model Settings</h2>
          <button id="closeModelSettingsButton" class="icon-button" type="button" title="Close">
            Close
          </button>
        </div>

        <p id="modelSettingsStatus" class="settings-status" role="status" aria-live="polite"></p>

        <div class="settings-tools">
          <button id="copyDebugLogButton" class="debug-action" type="button">
            Copy latest debug log
          </button>
          <button id="exportConfigButton" class="debug-action" type="button">
            Export configs
          </button>
          <button id="importConfigButton" class="debug-action" type="button">
            Import configs
          </button>
          <input id="importConfigInput" type="file" accept="application/json,.json" hidden>
        </div>

        <div class="settings-header">
          <h2>API Providers</h2>
        </div>
        <p class="settings-hint">
          Store one key per provider. Models linked to a provider inherit its key unless
          they set their own.
        </p>
        <p id="providerSettingsStatus" class="settings-status" role="status" aria-live="polite"></p>
        <div id="providerList" class="model-list"></div>

        <form id="providerForm" class="model-form">
          <input id="providerId" type="hidden">

          <label>
            <span>Provider name</span>
            <input id="providerName" type="text" required placeholder="google">
          </label>

          <label>
            <span>API key</span>
            <input id="providerApiKey" type="password" placeholder="Shared by all models on this provider">
          </label>

          <label>
            <span>Base URL</span>
            <input id="providerBaseUrl" type="url" placeholder="Optional default endpoint">
          </label>

          <div class="form-actions">
            <button id="saveProviderButton" type="submit">Save provider</button>
            <button id="cancelProviderEditButton" class="secondary" type="button">New provider</button>
          </div>
        </form>

        <div class="settings-divider"></div>

        <div class="settings-header">
          <h2>Models</h2>
        </div>

        <div id="modelList" class="model-list"></div>

        <form id="modelForm" class="model-form">
          <input id="modelId" type="hidden">

          <label>
            <span>Name</span>
            <input id="modelName" type="text" required placeholder="Gemma 4 31B">
          </label>

          <label>
            <span>Provider</span>
            <input id="modelProvider" type="text" required placeholder="google">
          </label>

          <label>
            <span>Adapter</span>
            <select id="modelAdapter" required>
              <option value="google-genai">google-genai</option>
              <option value="openai-compatible">openai-compatible</option>
            </select>
          </label>

          <label>
            <span>Model ID</span>
            <input id="modelNameId" type="text" required placeholder="gemma-4-31b-it">
          </label>

          <label>
            <span>Linked provider</span>
            <select id="modelProviderId">
              <option value="">None (use key below)</option>
            </select>
          </label>

          <label>
            <span>API key (optional override)</span>
            <input id="modelApiKey" type="password" placeholder="Leave blank to inherit the provider key">
          </label>

          <label>
            <span>Base URL</span>
            <input id="modelBaseUrl" type="url" placeholder="For OpenAI-compatible providers">
          </label>

          <label>
            <span>Headers JSON</span>
            <textarea id="modelHeaders" rows="3" spellcheck="false">{}</textarea>
          </label>

          <label>
            <span>Options JSON</span>
            <textarea id="modelOptions" rows="3" spellcheck="false">{}</textarea>
          </label>

          <label class="checkbox-field">
            <input id="modelActive" type="checkbox">
            <span>Set as active model</span>
          </label>

          <label class="checkbox-field">
            <input id="modelFinalPassActive" type="checkbox">
            <span>Use for extended final pass</span>
          </label>

          <div class="form-actions">
            <button id="saveModelButton" type="submit">Save model</button>
            <button id="cancelModelEditButton" class="secondary" type="button">Clear</button>
          </div>
        </form>

        <div class="settings-divider"></div>

        <div class="settings-header">
          <h2>Prompt Settings</h2>
        </div>

        <p id="promptSettingsStatus" class="settings-status" role="status" aria-live="polite"></p>
        <div id="promptList" class="model-list"></div>

        <form id="promptForm" class="model-form">
          <input id="promptId" type="hidden">

          <label>
            <span>Prompt name</span>
            <input id="promptName" type="text" required placeholder="Refinement">
          </label>

          <label>
            <span>Prompt instructions</span>
            <textarea id="promptContent" rows="10" required spellcheck="true"></textarea>
          </label>

          <label class="checkbox-field">
            <input id="promptActive" type="checkbox">
            <span>Set as active prompt</span>
          </label>

          <div class="form-actions">
            <button id="savePromptButton" type="submit">Save prompt</button>
            <button id="cancelPromptEditButton" class="secondary" type="button">New prompt</button>
          </div>
        </form>
      </section>
    </main>

    <script src="modelStore.js"></script>
    <script src="promptStore.js"></script>
    <script src="providerStore.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
